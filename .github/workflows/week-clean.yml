name: Week Clean

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  call-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call the Clean API Endpoint
        run: |
          curl -fsS -X POST https://cutiefly-sid.vercel.app/api/clean \
            -H "Authorization: Bearer ${{ secrets.CLEANUP_SECRET }}"
